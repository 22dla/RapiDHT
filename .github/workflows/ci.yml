name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every platform, rather than stopping at the first failure.
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
          - name: Windows / MSVC
            os: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The default configuration is CPU-only. Neither a CUDA toolkit nor an
      # MPI implementation is installed on the runners, so a green build here
      # also proves that both backends really are optional. GoogleTest is
      # vendored in 3dparty, so there is nothing else to fetch.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
